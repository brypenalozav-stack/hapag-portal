# CT-NEXUS – Nexus – condiciones comerciales, tipo de cambio y tarifas
# Contrato de integración en estado PROPUESTA (Fase 6a). Ver docs/integraciones/README.md.
openapi: 3.1.0
info:
  title: Nexus – condiciones comerciales, tipo de cambio y tarifas
  version: 0.1.0
  description: |
    PROPUESTA – pendiente de validación con Nexus/IT – Lucho (apoyo: Jorge)

    Lectura bajo demanda desde el portal hacia Nexus, con caché corta en el portal (decisión Q3: API, sin acceso
    directo a base de datos ni sincronización de tablas). Cubre las funciones NexusV2 «Exenciones», «Créditos»,
    «TC» y «Tarifa», y la lectura de FFWW autorizados.

    Hoy Nexus no expone API hacia el portal: este documento es la propuesta del equipo de desarrollo Portal 2.0
    para la tarea 26 de Pendientes. Fichas: M4-01, M4-02, M4-03, M4-04, M5-04, M5-05, M5-07, M8-01, M8-02, M8-03.
  x-contrato: CT-NEXUS
  x-estado: 'PROPUESTA – pendiente de validación con Nexus/IT – Lucho (apoyo: Jorge)'
  x-responsable: 'Nexus/IT – Lucho (apoyo: Jorge)'
  x-puerto:
  - IExemptionReader
  - ICreditConditionReader
  - IExchangeRateProvider
  - ITariffProvider
  x-tareas-pendientes: 25–41
servers:
- url: '{baseUrl}'
  description: URL base configurada en `Integrations:Nexus:BaseUrl`. La URL productiva la entrega el responsable al validar
    el contrato; por defecto apunta al simulador local (Fase 6c).
  variables:
    baseUrl:
      default: http://localhost:5199/nexus
security:
- ApiKey: []
tags:
- name: Condiciones comerciales
- name: Tipo de cambio
- name: Tarifas
paths:
  /exemptions:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getExemptions
      summary: Exenciones vigentes de un cliente
      description: Devuelve las exenciones vigentes a la fecha `at` (M4-01, M4-02). Lista vacía si el cliente no tiene exenciones.
      tags:
      - Condiciones comerciales
      parameters:
      - name: taxId
        in: query
        required: true
        description: RUT o NIT del cliente.
        schema:
          type: string
          minLength: 3
          maxLength: 20
          description: 'Identificador tributario: RUT en Chile (12345678-9) o NIT en Bolivia.'
        example: 76000001-1
      - name: matchCode
        in: query
        required: false
        description: Match Code del cliente, si se conoce.
        schema:
          type: string
        example: MC000101
      - name: at
        in: query
        required: false
        description: Fecha de vigencia consultada. Por defecto, la fecha actual en el huso del país.
        schema:
          type: string
          format: date
        example: '2026-10-20'
      responses:
        '200':
          description: Exenciones vigentes.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExemptionList'
              examples:
                exento:
                  value:
                    taxId: 76000001-1
                    matchCode: MC000101
                    at: '2026-10-20'
                    items:
                    - concept: GATE_IN
                      amount: null
                      currency: null
                      consignee: null
                      validFrom: '2026-01-01'
                      validTo: '2026-12-31'
                    - concept: EDS
                      amount: null
                      currency: null
                      consignee: null
                      validFrom: '2026-01-01'
                      validTo: '2026-12-31'
                sinExenciones:
                  value:
                    taxId: 77999999-9
                    matchCode: null
                    at: '2026-10-20'
                    items: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /customers/{taxId}/conditions:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getCustomerConditions
      summary: Condiciones comerciales de un cliente
      description: Indica si el cliente es FFWW autorizado y su condición de crédito vigente (M4-03, M5-07, M8-02, M8-03).
        `credit` es `null` cuando el cliente no tiene crédito. 404 si el RUT no existe en Nexus.
      tags:
      - Condiciones comerciales
      parameters:
      - name: taxId
        in: path
        required: true
        description: RUT o NIT del cliente.
        schema:
          type: string
          minLength: 3
          maxLength: 20
          description: 'Identificador tributario: RUT en Chile (12345678-9) o NIT en Bolivia.'
        example: 76000002-2
      - name: matchCode
        in: query
        required: false
        description: Match Code, cuando el RUT tiene más de uno.
        schema:
          type: string
        example: MC000202
      responses:
        '200':
          description: Condiciones del cliente.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerConditions'
              examples:
                credito:
                  value:
                    taxId: 76000002-2
                    matchCode: MC000202
                    isFreightForwarder: false
                    credit:
                      concepts:
                      - LOCAL_CHARGES
                      - MHD
                      creditDays: 30
                      validFrom: '2026-01-01'
                      validTo: null
                      approvedBy: fer
                ffww:
                  value:
                    taxId: 76000003-3
                    matchCode: MC000303
                    isFreightForwarder: true
                    credit: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /exchange-rates:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getExchangeRate
      summary: Tipo de cambio vigente
      description: 'Tipo de cambio entre dos monedas a una fecha (M5-04, M5-05). Monedas: USD, EUR, BOB y CLP. 404 si no hay
        valor aprobado para la fecha.'
      tags:
      - Tipo de cambio
      parameters:
      - name: from
        in: query
        required: true
        description: Moneda de origen.
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código ISO 4217 (CLP, BOB, USD, EUR).
        example: USD
      - name: to
        in: query
        required: true
        description: Moneda de destino.
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código ISO 4217 (CLP, BOB, USD, EUR).
        example: CLP
      - name: date
        in: query
        required: true
        description: Fecha de vigencia.
        schema:
          type: string
          format: date
        example: '2026-10-20'
      responses:
        '200':
          description: Tipo de cambio.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
              examples:
                usdClp:
                  value:
                    fromCurrency: USD
                    toCurrency: CLP
                    rate: 950
                    effectiveDate: '2026-10-20'
                    source: NEXUS
                    approved: true
                usdBob:
                  value:
                    fromCurrency: USD
                    toCurrency: BOB
                    rate: 6.91
                    effectiveDate: '2026-10-20'
                    source: FACTURACION_BOB
                    approved: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /tariffs:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getTariffs
      summary: Tarifas de recargos locales
      description: Montos fijos de recargos locales vigentes por país y concepto (M8-01). Reemplaza los montos que hoy están
        fijos en procedimientos almacenados.
      tags:
      - Tarifas
      parameters:
      - name: country
        in: query
        required: true
        description: País de operación.
        schema:
          type: string
          enum:
          - CL
          - BO
          description: País de operación (ISO 3166-1 alfa-2).
        example: CL
      - name: concept
        in: query
        required: true
        description: Concepto de recargo.
        schema:
          type: string
        example: WAREHOUSE_CHANGE
      - name: at
        in: query
        required: false
        description: Fecha de vigencia.
        schema:
          type: string
          format: date
        example: '2026-10-20'
      responses:
        '200':
          description: Tarifas vigentes.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffList'
              examples:
                cambioAlmacen:
                  value:
                    country: CL
                    concept: WAREHOUSE_CHANGE
                    at: '2026-10-20'
                    items:
                    - concept: WAREHOUSE_CHANGE
                      code: KTE
                      containerType: null
                      amount: 9940
                      currency: CLP
                      validFrom: '2026-10-01'
                      validTo: null
                    - concept: WAREHOUSE_CHANGE
                      code: KTF
                      containerType: null
                      amount: 110910
                      currency: CLP
                      validFrom: '2026-10-01'
                      validTo: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación (NF-27). El portal lo envía en cada llamada; si falta, el servicio genera
        uno y lo devuelve en la respuesta.
      schema:
        type: string
        maxLength: 64
      example: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  headers:
    CorrelationId:
      description: Mismo valor recibido en la solicitud, o uno generado por el servicio.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de reintentar (RFC 9110 §10.2.3).
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 'Solicitud inválida: parámetro faltante o con formato incorrecto.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            parametroInvalido:
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: Uno o más parámetros no cumplen el formato esperado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
                errors:
                - field: taxId
                  message: Debe tener el formato 12345678-9.
    NotFound:
      description: El recurso solicitado no existe.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noEncontrado:
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: No existe un recurso con el identificador indicado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cliente reintenta después de `Retry-After`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limite:
              value:
                type: about:blank
                title: Demasiadas solicitudes
                status: 429
                detail: Se superó el límite de solicitudes por minuto.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    InternalServerError:
      description: Error interno del servicio.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            errorInterno:
              value:
                type: about:blank
                title: Error interno
                status: 500
                detail: El servicio no pudo procesar la solicitud.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    ServiceUnavailable:
      description: Servicio no disponible temporalmente (mantención o dependencia caída).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noDisponible:
              value:
                type: about:blank
                title: Servicio no disponible
                status: 503
                detail: El servicio está en mantención. Reintente más tarde.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  schemas:
    Problem:
      type: object
      description: Detalle de error según RFC 9457 (`application/problem+json`). Admite miembros de extensión.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI que identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Código HTTP.
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
        instance:
          type: string
          format: uri-reference
          description: URI de la ocurrencia concreta.
        correlationId:
          type: string
          description: 'Extensión: valor de `X-Correlation-Id`.'
        errors:
          type: array
          description: 'Extensión: errores de validación por campo.'
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - title
      - status
      additionalProperties: true
    Exemption:
      type: object
      description: Exención vigente de un cliente para un concepto (NexusV2 «Exenciones»; hoy módulo «Exonerados»).
      properties:
        concept:
          type: string
          enum:
          - GATE_IN
          - EDS
          - GATE_OUT
          description: Concepto exento. Nexus hoy administra Gate In y EDS; Gate Out queda previsto.
        amount:
          type:
          - number
          - 'null'
          minimum: 0
          description: Monto exento. `null` cuando la exención es total.
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
        consignee:
          type:
          - string
          - 'null'
          description: Consignatario, cuando la exención lo restringe.
        validFrom:
          type: string
          format: date
        validTo:
          type:
          - string
          - 'null'
          format: date
      required:
      - concept
      - validFrom
    ExemptionList:
      type: object
      properties:
        taxId:
          type: string
          minLength: 3
          maxLength: 20
          description: 'Identificador tributario: RUT en Chile (12345678-9) o NIT en Bolivia.'
        matchCode:
          type:
          - string
          - 'null'
        at:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exemption'
      required:
      - taxId
      - at
      - items
    CreditCondition:
      type: object
      description: Condición de crédito (NexusV2 «Créditos»; tabla nueva en Nexus).
      properties:
        concepts:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - FREIGHT
            - LOCAL_CHARGES
            - MHD
            - STORAGE
          description: 'Conceptos cubiertos: flete, recargos locales, MHD y almacenaje.'
        creditDays:
          type: integer
          minimum: 1
        validFrom:
          type: string
          format: date
        validTo:
          type:
          - string
          - 'null'
          format: date
        approvedBy:
          type:
          - string
          - 'null'
          description: Usuario de Nexus que aprobó la condición.
      required:
      - concepts
      - creditDays
      - validFrom
    CustomerConditions:
      type: object
      properties:
        taxId:
          type: string
          minLength: 3
          maxLength: 20
          description: 'Identificador tributario: RUT en Chile (12345678-9) o NIT en Bolivia.'
        matchCode:
          type:
          - string
          - 'null'
        isFreightForwarder:
          type: boolean
          description: Cliente FFWW autorizado (M8-03, M4-04).
        credit:
          oneOf:
          - $ref: '#/components/schemas/CreditCondition'
          - type: 'null'
      required:
      - taxId
      - isFreightForwarder
      - credit
    ExchangeRate:
      type: object
      description: Tipo de cambio aplicable (M5-05). Nexus administra el porcentaje de ajuste; el portal usa el valor informado.
      properties:
        fromCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código ISO 4217 (CLP, BOB, USD, EUR).
        toCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código ISO 4217 (CLP, BOB, USD, EUR).
        rate:
          type: number
          exclusiveMinimum: 0
        effectiveDate:
          type: string
          format: date
        source:
          type: string
          description: Origen del valor (por ejemplo, NEXUS o FACTURACION_BOB).
        approved:
          type: boolean
          description: El valor está aprobado para uso en transacciones.
      required:
      - fromCurrency
      - toCurrency
      - rate
      - effectiveDate
      - source
      - approved
    TariffItem:
      type: object
      description: Monto fijo de un recargo local (NexusV2 «Tarifa», M8-01).
      properties:
        concept:
          type: string
        code:
          type:
          - string
          - 'null'
          description: Código de tarifa en Nexus, si existe.
        containerType:
          type:
          - string
          - 'null'
          description: Tipo ISO de contenedor, por ejemplo 22G1 o 45G1.
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código ISO 4217 (CLP, BOB, USD, EUR).
        validFrom:
          type: string
          format: date
        validTo:
          type:
          - string
          - 'null'
          format: date
      required:
      - concept
      - amount
      - currency
      - validFrom
    TariffList:
      type: object
      properties:
        country:
          type: string
          enum:
          - CL
          - BO
          description: País de operación (ISO 3166-1 alfa-2).
        concept:
          type: string
        at:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/TariffItem'
      required:
      - country
      - concept
      - at
      - items
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clave de API. En el portal se guarda cifrada como secreto `NEXUS_API_KEY` (NF-09).
