# CT-TATC – TATC / Flagare – estado de TATC y CLD (solo lectura)
# Contrato de integración en estado PROPUESTA (Fase 6a). Ver docs/integraciones/README.md.
openapi: 3.1.0
info:
  title: TATC / Flagare – estado de TATC y CLD (solo lectura)
  version: 0.1.0
  description: |
    PROPUESTA – pendiente de validación con Nexus/IT – Lucho

    La generación del TATC ya es automática fuera de Nexus y el CLD se registra en Nexus; el portal consulta su estado
    (NexusV2 «Generar TATC» y «Generar CLD», tareas 32–34). Hoy Nexus consulta el TATC con servicios HTTP de Flagare;
    este contrato propone la lectura equivalente para el portal.

    Ola F (M2-09): puerto `ITatcProvider` con adaptador Dummy y Real (`Integrations:Tatc:Mode`, `BaseUrl`), con caché
    corta del estado por BL (`Integrations:Tatc:CacheSeconds`, 30 s por defecto): el portal muestra el estado vigente,
    nunca el de una carga anterior. El portal usa `getBlTatc` y propone `requestTatcGeneration` para la generación
    masiva de clientes con alto volumen en una misma localidad; `getBlCld` queda sin uso en el portal.

    Estados del TATC en el portal (por contenedor): NOT_ISSUED → NotIssued, PRE_TATC → PreTatc, ISSUED → Issued,
    CANCELLED → Cancelled y cualquier otro código → Unknown. Estado agregado del BL: sin contenedores = NotRegistered;
    todos Issued = Issued; alguno Unknown = Unknown; alguno Issued = PartiallyIssued; alguno PreTatc = PreTatc; todos
    Cancelled = Cancelled; si no, NotIssued. Estos estados deben confirmarse con los equipos técnicos (M2-09).
  x-contrato: CT-TATC
  x-estado: PROPUESTA – pendiente de validación con Nexus/IT – Lucho
  x-responsable: Nexus/IT – Lucho
  x-puerto:
  - ITatcProvider
  x-tareas-pendientes: 32–34
servers:
- url: '{baseUrl}'
  description: URL base configurada en `Integrations:Tatc:BaseUrl`. La URL productiva la entrega el responsable al validar
    el contrato; por defecto apunta al simulador local (Fase 6c).
  variables:
    baseUrl:
      default: http://localhost:5199/tatc
security:
- ApiKey: []
tags:
- name: TATC
paths:
  /bills-of-lading/{blNumber}/tatc:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getBlTatc
      summary: Estado del TATC por BL
      description: Estado del TATC de cada contenedor del BL y motivos de no emisión (M2-09).
      tags:
      - TATC
      parameters:
      - name: blNumber
        in: path
        required: true
        description: Número de BL.
        schema:
          type: string
          minLength: 4
          maxLength: 20
          description: Número de BL.
        example: HLCUSCL2609A1234
      responses:
        '200':
          description: Estado del TATC.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlTatc'
              examples:
                pendiente:
                  value:
                    blNumber: HLCUSCL2609A1234
                    country: CL
                    updatedAt: '2026-10-20T13:05:00Z'
                    containers:
                    - containerNumber: HLBU1234567
                      tatcNumber: null
                      status: NOT_ISSUED
                      issuedAt: null
                      warehouseCode: ALM-SAI-01
                      pendingReasons:
                      - PAYMENT_PENDING
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /tatc/generation-requests:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    post:
      operationId: requestTatcGeneration
      summary: Generación masiva de TATC (propuesta Ola F)
      description: |
        Solicita en una sola llamada la generación del TATC de varios BL de importación de una misma localidad
        (M2-09, p. ej. la operación por Iquique de un cliente de alto volumen). El portal valida antes el acceso del
        cliente a cada BL. La cabecera `Idempotency-Key` repite `requestReference`: reintentos con la misma clave
        devuelven la misma respuesta.
      tags:
      - TATC
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Igual a `requestReference`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TatcGenerationRequest'
            examples:
              iquique:
                value:
                  requestReference: 8c3b8c78-5e5d-4300-ac21-24106959e344
                  country: CL
                  locationCode: CLIQQ
                  requestedByTaxId: 76000001-1
                  blNumbers:
                  - HLCUIQQ2609A0001
                  - HLCUIQQ2609A0002
      responses:
        '202':
          description: Solicitud recibida con el resultado por BL.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TatcGenerationReceipt'
              examples:
                parcial:
                  value:
                    requestId: TATC-REQ-8C3B8C78
                    items:
                    - blNumber: HLCUIQQ2609A0001
                      accepted: true
                    - blNumber: HLCUIQQ2609A0002
                      accepted: false
                      reasonCode: ALREADY_ISSUED
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bills-of-lading/{blNumber}/cld:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getBlCld
      summary: Estado del CLD por BL (Bolivia)
      description: Estado del CLD, requisito del TATC boliviano (M3-16, M6-07).
      tags:
      - TATC
      parameters:
      - name: blNumber
        in: path
        required: true
        description: Número de BL.
        schema:
          type: string
          minLength: 4
          maxLength: 20
          description: Número de BL.
        example: HLCUARI2609B5678
      responses:
        '200':
          description: Estado del CLD.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cld'
              examples:
                emitido:
                  value:
                    blNumber: HLCUARI2609B5678
                    status: SENT
                    depotName: Depósito El Alto
                    issuedAt: '2026-10-18T12:00:00Z'
                    sentAt: '2026-10-18T12:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación (NF-27). El portal lo envía en cada llamada; si falta, el servicio genera
        uno y lo devuelve en la respuesta.
      schema:
        type: string
        maxLength: 64
      example: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  headers:
    CorrelationId:
      description: Mismo valor recibido en la solicitud, o uno generado por el servicio.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de reintentar (RFC 9110 §10.2.3).
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 'Solicitud inválida: parámetro faltante o con formato incorrecto.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            parametroInvalido:
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: Uno o más parámetros no cumplen el formato esperado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
                errors:
                - field: taxId
                  message: Debe tener el formato 12345678-9.
    NotFound:
      description: El recurso solicitado no existe.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noEncontrado:
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: No existe un recurso con el identificador indicado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cliente reintenta después de `Retry-After`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limite:
              value:
                type: about:blank
                title: Demasiadas solicitudes
                status: 429
                detail: Se superó el límite de solicitudes por minuto.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    InternalServerError:
      description: Error interno del servicio.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            errorInterno:
              value:
                type: about:blank
                title: Error interno
                status: 500
                detail: El servicio no pudo procesar la solicitud.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    ServiceUnavailable:
      description: Servicio no disponible temporalmente (mantención o dependencia caída).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noDisponible:
              value:
                type: about:blank
                title: Servicio no disponible
                status: 503
                detail: El servicio está en mantención. Reintente más tarde.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  schemas:
    Problem:
      type: object
      description: Detalle de error según RFC 9457 (`application/problem+json`). Admite miembros de extensión.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI que identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Código HTTP.
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
        instance:
          type: string
          format: uri-reference
          description: URI de la ocurrencia concreta.
        correlationId:
          type: string
          description: 'Extensión: valor de `X-Correlation-Id`.'
        errors:
          type: array
          description: 'Extensión: errores de validación por campo.'
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - title
      - status
      additionalProperties: true
    ContainerTatc:
      type: object
      properties:
        containerNumber:
          type: string
        tatcNumber:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - NOT_ISSUED
          - PRE_TATC
          - ISSUED
          - CANCELLED
          description: Estados propuestos; M2-09 exige definirlos con los equipos técnicos de Hapag-Lloyd.
        issuedAt:
          type:
          - string
          - 'null'
          format: date-time
        warehouseCode:
          type:
          - string
          - 'null'
        pendingReasons:
          type: array
          items:
            type: string
            enum:
            - PAYMENT_PENDING
            - MHD_PENDING
            - DOCUMENT_PENDING
            - OTHER
          description: Motivos por los que el TATC aún no se emite.
      required:
      - containerNumber
      - status
      - pendingReasons
    BlTatc:
      type: object
      properties:
        blNumber:
          type: string
          minLength: 4
          maxLength: 20
          description: Número de BL.
        country:
          type: string
          enum:
          - CL
          - BO
          description: País de operación (ISO 3166-1 alfa-2).
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerTatc'
        updatedAt:
          type: string
          format: date-time
      required:
      - blNumber
      - country
      - containers
      - updatedAt
    TatcGenerationRequest:
      type: object
      description: Propuesta Ola F (M2-09).
      properties:
        requestReference:
          type: string
          description: Identificador de la solicitud en el portal (clave de idempotencia).
        country:
          type: string
          enum:
          - CL
          - BO
        locationCode:
          type: string
          description: UN/LOCODE de la localidad (puerto de descarga o destino final) común a todos los BL.
        requestedByTaxId:
          type: string
          description: RUT/NIT de la organización solicitante.
        blNumbers:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
      required:
      - requestReference
      - country
      - locationCode
      - requestedByTaxId
      - blNumbers
    TatcGenerationReceipt:
      type: object
      description: Propuesta Ola F (M2-09).
      properties:
        requestId:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              blNumber:
                type: string
              accepted:
                type: boolean
              reasonCode:
                type:
                - string
                - 'null'
                description: Motivo del rechazo, p. ej. NOT_FOUND o ALREADY_ISSUED.
            required:
            - blNumber
            - accepted
      required:
      - requestId
      - items
    Cld:
      type: object
      description: Certificado CLD de la operación de Bolivia (NexusV2 «Generar CLD»).
      properties:
        blNumber:
          type: string
          minLength: 4
          maxLength: 20
          description: Número de BL.
        status:
          type: string
          enum:
          - NOT_ISSUED
          - ISSUED
          - SENT
        depotName:
          type:
          - string
          - 'null'
          description: Depósito boliviano.
        issuedAt:
          type:
          - string
          - 'null'
          format: date-time
        sentAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - blNumber
      - status
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clave de API. El tipo de secreto se define al validar el contrato (NF-09).
