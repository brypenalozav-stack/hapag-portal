# CT-CONTACTS – Registro de contactos y listas de distribución de reportes (P0060)
# Contrato de integración en estado PROPUESTA (Fase 2, Ola I). Ver docs/integraciones/README.md.
openapi: 3.1.0
info:
  title: Registro de contactos y listas de distribución (P0060)
  version: 0.1.0
  description: |
    PROPUESTA – pendiente de validación con Customer Service – Cami/Mati (apoyo: Nexus/IT – Jorge)

    Lectura y actualización de los correos de contacto registrados por tipo de reporte (aviso de arribo, copias de BL,
    facturas, free time, demurrage y confirmación de booking) para una cuenta identificada por su Match Code (M1-06).
    Hoy los contactos se mantienen en el registro interno P0060 y su actualización depende de una gestión interna; con
    esta API el cliente los actualiza desde el portal y el cambio se propaga al registro.
  x-contrato: CT-CONTACTS
  x-estado: 'PROPUESTA – pendiente de validación con Customer Service – Cami/Mati (apoyo: Nexus/IT – Jorge)'
  x-responsable: 'Customer Service – Cami/Mati (apoyo: Nexus/IT – Jorge)'
  x-puerto:
  - IContactListProvider
  x-tareas-pendientes: sin tarea en Pendientes
servers:
- url: '{baseUrl}'
  description: URL base configurada en `Integrations:Contacts:BaseUrl`. La URL productiva la entrega el responsable al
    validar el contrato; por defecto apunta al simulador local.
  variables:
    baseUrl:
      default: http://localhost:5199/contacts
security:
- ApiKey: []
tags:
- name: Contactos
paths:
  /contacts/{matchCode}/distribution-lists:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/MatchCode'
    get:
      operationId: getDistributionLists
      summary: Listas de distribución de una cuenta
      description: Correos registrados por tipo de reporte. Un tipo sin correos puede omitirse; una cuenta sin listas
        responde 404.
      tags:
      - Contactos
      parameters:
      - $ref: '#/components/parameters/Country'
      responses:
        '200':
          description: Listas de distribución de la cuenta.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionLists'
              examples:
                importadora:
                  value:
                    matchCode: MC100010
                    country: CL
                    lists:
                    - reportType: ARRIVAL_NOTICE
                      emails:
                      - operaciones@importadorademo.cl
                      - demo@importadorademo.cl
                      updatedAt: '2026-09-15T13:00:00Z'
                      updatedBy: P0060
                    - reportType: INVOICES
                      emails:
                      - finanzas@importadorademo.cl
                      updatedAt: '2026-09-15T13:00:00Z'
                      updatedBy: P0060
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /contacts/{matchCode}/distribution-lists/{reportType}:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - $ref: '#/components/parameters/MatchCode'
    - name: reportType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReportType'
      example: INVOICES
    put:
      operationId: putDistributionList
      summary: Reemplazar los correos de un tipo de reporte
      description: Reemplaza la lista completa de correos del tipo de reporte con la indicada por el cliente en el portal
        (máximo 20). Una lista vacía deja el reporte sin destinatarios.
      tags:
      - Contactos
      parameters:
      - $ref: '#/components/parameters/Country'
      - name: Idempotency-Key
        in: header
        required: true
        description: Clave única del cambio en el portal. Repetir la misma clave con el mismo cuerpo devuelve el mismo
          resultado sin registrar el cambio dos veces.
        schema:
          type: string
          maxLength: 80
        example: contacts-6f1c2a9e0b7d4e1a9c3b5d7f8e2a4c6b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: email
                updatedBy:
                  type: string
                  description: Usuario del portal que hizo el cambio.
              required:
              - emails
              - updatedBy
            examples:
              facturas:
                value:
                  emails:
                  - finanzas@importadorademo.cl
                  - cobranza@importadorademo.cl
                  updatedBy: demo@importadorademo.cl
      responses:
        '200':
          description: Lista tal como quedó en el registro y la referencia del cambio.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    $ref: '#/components/schemas/DistributionList'
                  changeReference:
                    type: string
                required:
                - list
                - changeReference
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La misma `Idempotency-Key` ya se usó con otro cuerpo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación (NF-27). El portal lo envía en cada llamada; si falta, el servicio genera
        uno y lo devuelve en la respuesta.
      schema:
        type: string
        maxLength: 64
      example: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    MatchCode:
      name: matchCode
      in: path
      required: true
      description: Match Code de la cuenta en Hapag-Lloyd.
      schema:
        type: string
        maxLength: 20
      example: MC100010
    Country:
      name: country
      in: query
      required: true
      description: País de operación de la cuenta.
      schema:
        type: string
        enum:
        - CL
        - BO
      example: CL
  headers:
    CorrelationId:
      description: Mismo valor recibido en la solicitud, o uno generado por el servicio.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de reintentar (RFC 9110 §10.2.3).
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 'Solicitud inválida: parámetro faltante o con formato incorrecto.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            parametroInvalido:
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: Uno o más parámetros no cumplen el formato esperado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
                errors:
                - field: taxId
                  message: Debe tener el formato 12345678-9.
    NotFound:
      description: El recurso solicitado no existe.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noEncontrado:
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: No existe un recurso con el identificador indicado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cliente reintenta después de `Retry-After`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limite:
              value:
                type: about:blank
                title: Demasiadas solicitudes
                status: 429
                detail: Se superó el límite de solicitudes por minuto.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    InternalServerError:
      description: Error interno del servicio.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            errorInterno:
              value:
                type: about:blank
                title: Error interno
                status: 500
                detail: El servicio no pudo procesar la solicitud.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    ServiceUnavailable:
      description: Servicio no disponible temporalmente (mantención o dependencia caída).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noDisponible:
              value:
                type: about:blank
                title: Servicio no disponible
                status: 503
                detail: El servicio está en mantención. Reintente más tarde.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  schemas:
    Problem:
      type: object
      description: Detalle de error según RFC 9457 (`application/problem+json`). Admite miembros de extensión.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI que identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Código HTTP.
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
        instance:
          type: string
          format: uri-reference
          description: URI de la ocurrencia concreta.
        correlationId:
          type: string
          description: 'Extensión: valor de `X-Correlation-Id`.'
        errors:
          type: array
          description: 'Extensión: errores de validación por campo.'
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - title
      - status
      additionalProperties: true
    ReportType:
      type: string
      enum:
      - ARRIVAL_NOTICE
      - BL_COPIES
      - INVOICES
      - FREE_TIME
      - DEMURRAGE
      - BOOKING_CONFIRMATION
      description: Tipo de reporte con lista de distribución.
    DistributionList:
      type: object
      properties:
        reportType:
          $ref: '#/components/schemas/ReportType'
        emails:
          type: array
          items:
            type: string
            format: email
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedBy:
          type:
          - string
          - 'null'
      required:
      - reportType
      - emails
    DistributionLists:
      type: object
      properties:
        matchCode:
          type: string
        country:
          type: string
          enum:
          - CL
          - BO
        lists:
          type: array
          items:
            $ref: '#/components/schemas/DistributionList'
      required:
      - matchCode
      - lists
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clave de API. En el portal se guarda cifrada como secreto `CONTACTS_API_KEY` (NF-09).
