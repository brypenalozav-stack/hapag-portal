# CT-MERC – Mercurio – almacenes (solo lectura)
# Contrato de integración en estado PROPUESTA (Fase 6a). Ver docs/integraciones/README.md.
openapi: 3.1.0
info:
  title: Mercurio – almacenes (solo lectura)
  version: 0.1.0
  description: |
    PROPUESTA – pendiente de validación con Nexus/IT – Lucho

    Solo lectura. Hoy Nexus usa la API de Mercurio únicamente con GET; el portal tampoco escribe en Mercurio.
    La actualización de Mercurio tras un cambio de almacén sigue en Nexus (NexusV2 «Cambio de Almacén», tarea 32).
    Sin puerto en el plan.
  x-contrato: CT-MERC
  x-estado: PROPUESTA – pendiente de validación con Nexus/IT – Lucho
  x-responsable: Nexus/IT – Lucho
  x-puerto: []
  x-tareas-pendientes: '32'
servers:
- url: '{baseUrl}'
  description: URL base configurada en `Integrations:Mercurio:BaseUrl`. La URL productiva la entrega el responsable al validar
    el contrato; por defecto apunta al simulador local (Fase 6c).
  variables:
    baseUrl:
      default: http://localhost:5199/mercurio
security:
- ApiKey: []
tags:
- name: Almacenes
paths:
  /warehouses:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getWarehouses
      summary: Almacenes habilitados por puerto
      description: Catálogo de almacenes para elegir el destino de un cambio de almacén (M3-04, M3-05).
      tags:
      - Almacenes
      parameters:
      - name: port
        in: query
        required: true
        description: UN/LOCODE del puerto.
        schema:
          type: string
        example: CLSAI
      responses:
        '200':
          description: Almacenes.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseList'
              examples:
                sanAntonio:
                  value:
                    items:
                    - code: ALM-SAI-01
                      name: Almacén Extraportuario San Antonio 1
                      port: CLSAI
                      active: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bills-of-lading/{blNumber}/warehouse:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getBlWarehouse
      summary: Almacén asignado a los contenedores de un BL
      description: Almacén vigente por contenedor, antes y después de un cambio de almacén (M3-06).
      tags:
      - Almacenes
      parameters:
      - name: blNumber
        in: path
        required: true
        description: Número de BL.
        schema:
          type: string
          minLength: 4
          maxLength: 20
          description: Número de BL.
        example: HLCUSCL2609A1234
      responses:
        '200':
          description: Asignación vigente.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlWarehouseAssignment'
              examples:
                asignado:
                  value:
                    blNumber: HLCUSCL2609A1234
                    port: CLSAI
                    updatedAt: '2026-10-20T13:05:00Z'
                    containers:
                    - containerNumber: HLBU1234567
                      warehouseCode: ALM-SAI-01
                      warehouseName: Almacén Extraportuario San Antonio 1
                      assignedAt: '2026-10-19T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación (NF-27). El portal lo envía en cada llamada; si falta, el servicio genera
        uno y lo devuelve en la respuesta.
      schema:
        type: string
        maxLength: 64
      example: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  headers:
    CorrelationId:
      description: Mismo valor recibido en la solicitud, o uno generado por el servicio.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de reintentar (RFC 9110 §10.2.3).
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 'Solicitud inválida: parámetro faltante o con formato incorrecto.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            parametroInvalido:
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: Uno o más parámetros no cumplen el formato esperado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
                errors:
                - field: taxId
                  message: Debe tener el formato 12345678-9.
    NotFound:
      description: El recurso solicitado no existe.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noEncontrado:
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: No existe un recurso con el identificador indicado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cliente reintenta después de `Retry-After`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limite:
              value:
                type: about:blank
                title: Demasiadas solicitudes
                status: 429
                detail: Se superó el límite de solicitudes por minuto.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    InternalServerError:
      description: Error interno del servicio.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            errorInterno:
              value:
                type: about:blank
                title: Error interno
                status: 500
                detail: El servicio no pudo procesar la solicitud.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    ServiceUnavailable:
      description: Servicio no disponible temporalmente (mantención o dependencia caída).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noDisponible:
              value:
                type: about:blank
                title: Servicio no disponible
                status: 503
                detail: El servicio está en mantención. Reintente más tarde.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  schemas:
    Problem:
      type: object
      description: Detalle de error según RFC 9457 (`application/problem+json`). Admite miembros de extensión.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI que identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Código HTTP.
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
        instance:
          type: string
          format: uri-reference
          description: URI de la ocurrencia concreta.
        correlationId:
          type: string
          description: 'Extensión: valor de `X-Correlation-Id`.'
        errors:
          type: array
          description: 'Extensión: errores de validación por campo.'
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - title
      - status
      additionalProperties: true
    Warehouse:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        port:
          type: string
          description: UN/LOCODE del puerto (CLSAI, CLVAP, …).
        active:
          type: boolean
      required:
      - code
      - name
      - port
      - active
    WarehouseList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Warehouse'
      required:
      - items
    ContainerWarehouse:
      type: object
      properties:
        containerNumber:
          type: string
        warehouseCode:
          type: string
        warehouseName:
          type:
          - string
          - 'null'
        assignedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - containerNumber
      - warehouseCode
    BlWarehouseAssignment:
      type: object
      properties:
        blNumber:
          type: string
          minLength: 4
          maxLength: 20
          description: Número de BL.
        port:
          type: string
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerWarehouse'
        updatedAt:
          type: string
          format: date-time
      required:
      - blNumber
      - port
      - containers
      - updatedAt
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clave de API. El tipo de secreto se define al validar el contrato (NF-09).
