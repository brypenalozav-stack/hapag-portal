<!-- Pantallas angostas: botón que despliega el campo bajo la barra superior -->
<button #toggleBtn type="button" class="btn btn-link text-white p-0 hl-icon-btn hl-search__toggle" aria-controls="hl-search"
        [attr.aria-expanded]="open()" [attr.aria-label]="'shared.search.open' | transloco" data-testid="search-toggle" (click)="toggle()">
  <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
  </svg>
</button>

<!-- El landmark de búsqueda es un div: los formularios de filtros de las páginas usan form[role="search"] -->
<div id="hl-search" class="hl-search" [class.is-open]="open()" role="search" [attr.aria-label]="'shared.search.label' | transloco">
<form class="hl-search__form"
      (submit)="submit($event)" novalidate>
  <label for="hl-search-input" class="visually-hidden">{{ 'shared.search.label' | transloco }}</label>
  <svg class="hl-search__icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
  </svg>
  <input #field id="hl-search-input" type="search" class="hl-search__input" autocomplete="off" spellcheck="false" enterkeyhint="search"
         [value]="term()" [placeholder]="'shared.search.placeholder' | transloco" [attr.aria-describedby]="message() ? 'hl-search-message' : 'hl-search-hint'"
         [attr.aria-invalid]="message() === messageKeys.invalid ? true : null" data-testid="global-search-input"
         (input)="onInput($event)" (keydown.escape)="onEscape($event)" />
  <kbd class="hl-search__kbd" aria-hidden="true">/</kbd>
  <span id="hl-search-hint" class="visually-hidden">{{ 'shared.search.hint' | transloco }}</span>
  <button type="submit" class="hl-search__submit" [disabled]="searching()" [attr.aria-label]="'shared.search.submit' | transloco"
          data-testid="global-search-submit">
    @if (searching()) {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    } @else {
      <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
      </svg>
    }
  </button>
  <div id="hl-search-message" class="hl-search__message" data-testid="global-search-message">
    @if (message(); as m) {
      {{ m | transloco }}
    }
  </div>
</form>
</div>
