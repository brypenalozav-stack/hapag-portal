server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html y los textos de idioma (/i18n/*.json, sin hash en el nombre) se revalidan siempre (ETag):
    # un despliegue nuevo se ve de inmediato y, sin cambios, el navegador recibe un 304 sin cuerpo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    # Paquetes JS/CSS y fuentes llevan hash en el nombre: se guardan un año.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes sin hash (banderas, logos de medios de pago): una semana con revalidación.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
}
