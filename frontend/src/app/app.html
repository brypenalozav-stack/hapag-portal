<app-navbar (toggleSidebar)="toggleSidebar()" />

@if (auth.isAuthenticated()) {
  <app-sidebar [isOpen]="sidebarOpen()" (closed)="closeSidebar()" />

  <main class="hl-main-content">
    <router-outlet />
  </main>

  <footer class="hl-footer">
    <span>{{ 'app.footer.copyright' | transloco }}</span>
  </footer>
} @else {
  <main>
    <router-outlet />
  </main>
}
