<div class="hl-page-header">
  <h1>{{ 'demurrage.title' | transloco }}</h1>
  <p class="text-muted mb-0">{{ 'demurrage.subtitle' | transloco }}</p>
</div>

<div class="hl-card p-4 mb-4">
  <form class="row g-3 hl-form-row" role="search" [attr.aria-label]="'demurrage.search.label' | transloco" (ngSubmit)="search()">
    <div class="col-md-8 col-lg-6">
      <label for="demurrage-bl-number" class="form-label fw-semibold">{{ 'demurrage.search.blNumber' | transloco }}</label>
      <input id="demurrage-bl-number" type="text" class="form-control" name="blNumber" autocomplete="off"
             aria-describedby="demurrage-bl-number-help" [(ngModel)]="searchBlNumber" />
      <div id="demurrage-bl-number-help" class="form-text">{{ 'demurrage.search.help' | transloco }}</div>
    </div>
    <div class="col-auto hl-form-action hl-form-action--lg-label">
      <button type="submit" class="btn btn-hl-orange px-4" [disabled]="!searchBlNumber.trim()">{{ 'demurrage.search.submit' | transloco }}</button>
    </div>
  </form>
</div>

@if (activeBl(); as bl) {
  <!-- Vista enfocada: el detalle del BL reúne el demurrage con el resto del embarque -->
  <p class="mb-3"><a [routerLink]="['/shipments', bl]" data-testid="view-full-detail">{{ 'shipments.detail.viewFull' | transloco: { bl } }}</a></p>
  <app-demurrage-panel [blNumber]="bl" />
} @else {
  <div class="hl-card p-5 text-center" role="status">
    <p class="text-muted mb-0">{{ 'demurrage.initial' | transloco }}</p>
  </div>
}
