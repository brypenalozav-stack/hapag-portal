name: PR Tests

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore HapagPortal.sln

      - name: Build solution
        run: dotnet build HapagPortal.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test HapagPortal.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: backend/TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

  contracts:
    name: Contratos — Simulador y schemathesis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract tools
        run: python -m pip install -r docs/integraciones/requirements.txt

      - name: Verify contracts and inventory
        run: python scripts/requerimientos/verificar_contratos.py

      - name: Validate OpenAPI contracts
        run: for f in docs/integraciones/contratos/*.openapi.yaml; do openapi-spec-validator "$f" || exit 1; done

      - name: Build integration simulator
        run: dotnet build backend/tools/HapagPortal.IntegrationSimulator/HapagPortal.IntegrationSimulator.csproj --configuration Release

      - name: Start integration simulator
        run: |
          nohup dotnet run --project backend/tools/HapagPortal.IntegrationSimulator --configuration Release --no-build --urls http://localhost:5199 > simulator.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5199/contracts/nexus > /dev/null && exit 0
            sleep 2
          done
          cat simulator.log
          exit 1

      - name: Contract tests (schemathesis)
        run: |
          for x in nexus fis khipu banco-chile dbnet tracking; do
            schemathesis run "docs/integraciones/contratos/$x.openapi.yaml" --url "http://localhost:5199/$x" \
              --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance || exit 1
          done

      - name: Simulator log
        if: always()
        run: cat simulator.log || true

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Check hex colors (tokens)
        run: npm run check:hex

      - name: Check i18n keys (es/en parity, ICU, used keys)
        run: npm run check:i18n

      - name: Check hardcoded template texts
        run: npm run check:i18n-text

      - name: Check table header scope
        run: npm run check:table-scope

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Check Bootstrap theme overrides
        run: npm run check:theme

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts compila la configuración `e2e` (apiUrl '/api/v1') y la sirve como archivos estáticos;
      # con la caché de Angular activa también en CI (angular.json, cli.cache.environment) reutiliza la compilación
      # de producción de arriba y tarda segundos.
      - name: E2E tests (Playwright + axe, static e2e build)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
