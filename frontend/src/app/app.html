<a class="hl-skip-link" href="#contenido-principal" (click)="skipToContent($event)">{{ 'app.skipLink' | transloco }}</a>

<header>
  <app-navbar [sidebarOpen]="sidebarOpen()" (toggleSidebar)="toggleSidebar()" />
</header>

@if (auth.isAuthenticated()) {
  <app-sidebar [isOpen]="sidebarOpen()" (closed)="closeSidebar()" />

  <main id="contenido-principal" class="hl-main-content" tabindex="-1">
    <!-- Vista como cliente (M8-08): banner permanente mientras dura la sesión de impersonación -->
    <app-impersonation-banner />
    <!-- Modo guía (M1-27): guías de la pantalla actual -->
    <app-guide-host />
    <router-outlet />
  </main>

  <footer class="hl-footer">
    <span>{{ 'app.footer.copyright' | transloco }}</span>
  </footer>

  <!-- Asistente del portal (M10-01): disponible en todas las pantallas autenticadas; se carga sin demorar la portada -->
  @defer (on idle) {
    <app-assistant />
  }
} @else {
  <main id="contenido-principal" tabindex="-1">
    <router-outlet />
  </main>
}

<!-- Pantalla de carga global (cambio de idioma y operaciones que bloquean todo el sitio) -->
<app-global-loader />

<!-- Modal único de confirmaciones y avisos (ModalService) -->
<app-modal-host />

<!-- Avisos breves tras una acción (ToastService) -->
<app-toast-host />

<!-- Regiones de anuncios para lectores de pantalla (LiveAnnouncerService, guía UI §3.3) -->
<div class="visually-hidden" aria-live="polite" aria-atomic="true">{{ announcer.polite() }}</div>
<div class="visually-hidden" aria-live="assertive" aria-atomic="true">{{ announcer.assertive() }}</div>
