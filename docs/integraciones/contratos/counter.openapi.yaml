# CT-COUNTER – Counter Bolivia/Ultramar de Nexus
# Contrato de integración en estado PROPUESTA (Fase 2, Ola I). Ver docs/integraciones/README.md.
openapi: 3.1.0
info:
  title: Counter Bolivia/Ultramar (Nexus)
  version: 0.1.0
  description: |
    PROPUESTA – pendiente de validación con Nexus/IT – Lucho (apoyo: Jorge)

    Registro por BL de la fecha de canje, la recepción del HBL y la marca de desconsolidado de los embarques de Bolivia y
    de ultramar, con el país de la operación (M8-09). La función Counter vive en Nexus (tablas de canje del origen); el
    portal registra desde su pantalla interna y propaga cada cambio con esta API, conservando una copia local con su estado
    de sincronización. El estado es insumo de la carta de liberación y desconsolidado (M6-08) y del certificado de libre
    deuda (M6-07). Usa la misma URL base y la misma clave que CT-NEXUS.
  x-contrato: CT-COUNTER
  x-estado: 'PROPUESTA – pendiente de validación con Nexus/IT – Lucho (apoyo: Jorge)'
  x-responsable: 'Nexus/IT – Lucho (apoyo: Jorge)'
  x-puerto:
  - ICounterRecorder
  x-tareas-pendientes: '41'
servers:
- url: '{baseUrl}'
  description: URL base configurada en `Integrations:Nexus:BaseUrl` (la misma de CT-NEXUS). La URL productiva la entrega el
    responsable al validar el contrato; por defecto apunta al simulador local.
  variables:
    baseUrl:
      default: http://localhost:5199/nexus
security:
- ApiKey: []
tags:
- name: Counter
paths:
  /counter/bills-of-lading/{blNumber}:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    - name: blNumber
      in: path
      required: true
      description: Número de BL.
      schema:
        type: string
        minLength: 4
        maxLength: 50
      example: HLCUARI260300830
    get:
      operationId: getCounterRecord
      summary: Estado de Counter de un BL
      description: Fecha de canje, recepción del HBL y marca de desconsolidado registradas en Nexus. 404 si el BL no tiene
        registro de Counter.
      tags:
      - Counter
      responses:
        '200':
          description: Registro de Counter del BL.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterRecord'
              examples:
                canjeado:
                  value:
                    blNumber: HLCUARI260300830
                    country: BO
                    exchangeDate: '2026-10-02'
                    hblReceived: true
                    hblReceivedAt: '2026-10-03'
                    deconsolidated: false
                    deconsolidatedAt: null
                    notes: null
                    sourceReference: CNT-BO-000830
                    recordedAt: '2026-10-03T14:00:00Z'
                    recordedBy: admin@hapag-lloyd.cl
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: putCounterRecord
      summary: Registrar o modificar el Counter de un BL
      description: Reemplaza el registro de Counter del BL con los datos indicados por el usuario interno del portal. Cada
        cambio se identifica con `Idempotency-Key`.
      tags:
      - Counter
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Clave única del cambio en el portal. Repetir la misma clave con el mismo cuerpo devuelve el mismo
          resultado sin registrar el cambio dos veces.
        schema:
          type: string
          maxLength: 80
        example: counter-6f1c2a9e0b7d4e1a9c3b5d7f8e2a4c6b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterRecordInput'
            examples:
              desconsolidado:
                value:
                  country: BO
                  exchangeDate: '2026-10-04'
                  hblReceived: true
                  hblReceivedAt: '2026-10-04'
                  deconsolidated: true
                  deconsolidatedAt: '2026-10-05'
                  notes: Desconsolidado en el depósito de Arica.
                  recordedBy: admin@hapag-lloyd.cl
      responses:
        '200':
          description: Registro tal como quedó en Nexus.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La misma `Idempotency-Key` ya se usó con otro cuerpo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación (NF-27). El portal lo envía en cada llamada; si falta, el servicio genera
        uno y lo devuelve en la respuesta.
      schema:
        type: string
        maxLength: 64
      example: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  headers:
    CorrelationId:
      description: Mismo valor recibido en la solicitud, o uno generado por el servicio.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de reintentar (RFC 9110 §10.2.3).
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 'Solicitud inválida: parámetro faltante o con formato incorrecto.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            parametroInvalido:
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: Uno o más parámetros no cumplen el formato esperado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
                errors:
                - field: taxId
                  message: Debe tener el formato 12345678-9.
    NotFound:
      description: El recurso solicitado no existe.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noEncontrado:
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: No existe un recurso con el identificador indicado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cliente reintenta después de `Retry-After`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limite:
              value:
                type: about:blank
                title: Demasiadas solicitudes
                status: 429
                detail: Se superó el límite de solicitudes por minuto.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    InternalServerError:
      description: Error interno del servicio.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            errorInterno:
              value:
                type: about:blank
                title: Error interno
                status: 500
                detail: El servicio no pudo procesar la solicitud.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    ServiceUnavailable:
      description: Servicio no disponible temporalmente (mantención o dependencia caída).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noDisponible:
              value:
                type: about:blank
                title: Servicio no disponible
                status: 503
                detail: El servicio está en mantención. Reintente más tarde.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  schemas:
    Problem:
      type: object
      description: Detalle de error según RFC 9457 (`application/problem+json`). Admite miembros de extensión.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI que identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Código HTTP.
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
        instance:
          type: string
          format: uri-reference
          description: URI de la ocurrencia concreta.
        correlationId:
          type: string
          description: 'Extensión: valor de `X-Correlation-Id`.'
        errors:
          type: array
          description: 'Extensión: errores de validación por campo.'
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - title
      - status
      additionalProperties: true
    CounterRecordInput:
      type: object
      properties:
        country:
          type: string
          enum:
          - CL
          - BO
          description: País de la operación.
        exchangeDate:
          type:
          - string
          - 'null'
          format: date
          description: Fecha de canje del BL.
        hblReceived:
          type: boolean
        hblReceivedAt:
          type:
          - string
          - 'null'
          format: date
        deconsolidated:
          type: boolean
        deconsolidatedAt:
          type:
          - string
          - 'null'
          format: date
        notes:
          type:
          - string
          - 'null'
          maxLength: 500
        recordedBy:
          type: string
          description: Usuario interno del portal que registró el cambio.
      required:
      - country
      - hblReceived
      - deconsolidated
      - recordedBy
    CounterRecord:
      allOf:
      - $ref: '#/components/schemas/CounterRecordInput'
      - type: object
        properties:
          blNumber:
            type: string
          sourceReference:
            type: string
            description: Referencia del registro en Nexus.
          recordedAt:
            type: string
            format: date-time
        required:
        - blNumber
        - sourceReference
        - recordedAt
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clave de API de Nexus. En el portal se guarda cifrada como secreto `NEXUS_API_KEY` (NF-09).
