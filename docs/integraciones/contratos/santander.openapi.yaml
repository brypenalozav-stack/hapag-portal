# CT-SANT – Santander – pagos
# Contrato de integración en estado PROPUESTA (Fase 6a). Ver docs/integraciones/README.md.
openapi: 3.1.0
info:
  title: Santander – pagos
  version: 0.1.0
  description: |
    PROPUESTA – pendiente de validación con Finanzas – Ricardo

    Propuesta de contrato de pago para Santander: iniciar el pago, consultar su estado y recibir la notificación firmada.
    Igual a CT-BCH. La ruta del webhook es una propuesta: hoy no existe. En el plan solo hay adaptador Dummy.
    Fichas: M5-01, M5-03, M7-02, NF-01, NF-04, NF-12. Tareas de Pendientes: 47–49, 52, 55.
  x-contrato: CT-SANT
  x-estado: PROPUESTA – pendiente de validación con Finanzas – Ricardo
  x-responsable: Finanzas – Ricardo
  x-puerto:
  - IPaymentProvider("Santander")
  x-tareas-pendientes: 47–49, 52, 55
servers:
- url: '{baseUrl}'
  description: URL base configurada en `Integrations:Santander:BaseUrl`. La URL productiva la entrega el responsable al validar
    el contrato; por defecto apunta al simulador local (Fase 6c).
  variables:
    baseUrl:
      default: http://localhost:5199/santander
security:
- ApiKey: []
tags:
- name: Pagos
- name: Notificaciones
paths:
  /payments:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    post:
      operationId: initiatePayment
      summary: Iniciar un pago
      description: Registra el cobro en el banco y devuelve la URL de pago (M5-01, M5-03).
      tags:
      - Pagos
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Clave de idempotencia (NF-01). Reenviar la misma clave devuelve el mismo pago sin crear otro.
        schema:
          type: string
          maxLength: 64
        example: PAY-2026-000123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiationRequest'
            examples:
              cargosLocales:
                value:
                  externalReference: PAY-2026-000123
                  amount: 245000
                  currency: CLP
                  subject: Cargos locales BL HLCUSCL2609A1234
                  payerTaxId: 76000001-1
                  returnUrl: https://portal.example/pagos/PAY-2026-000123/retorno
                  cancelUrl: https://portal.example/pagos/PAY-2026-000123/cancelado
                  notifyUrl: https://portal.example/api/v1/payments/webhook/santander
                  expiresAt: '2026-10-21T14:00:00Z'
      responses:
        '200':
          description: Pago iniciado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiation'
              examples:
                iniciado:
                  value:
                    reference: SAN-7781230
                    externalReference: PAY-2026-000123
                    status: PENDING
                    redirectUrl: https://pagos.santander.example/checkout/SAN-7781230
                    expiresAt: '2026-10-21T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payments/{reference}:
    parameters:
    - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getPayment
      summary: Consultar un pago
      description: Estado vigente del pago, para verificar la notificación y conciliar (NF-04).
      tags:
      - Pagos
      parameters:
      - name: reference
        in: path
        required: true
        description: Referencia del pago en el banco.
        schema:
          type: string
        example: SAN-7781230
      responses:
        '200':
          description: Estado del pago.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
              examples:
                confirmado:
                  value:
                    reference: SAN-7781230
                    externalReference: PAY-2026-000123
                    status: CONFIRMED
                    amount: 245000
                    currency: CLP
                    transactionId: 000981234567
                    payerTaxId: 76000001-1
                    paidAt: '2026-10-20T14:31:55Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
webhooks:
  paymentNotification:
    post:
      operationId: receivePaymentNotification
      summary: Notificación de pago hacia el portal
      description: 'El banco notifica el resultado a `/api/v1/payments/webhook/santander`. El portal valida el secreto y la
        firma, y la notificación es idempotente: repetirla no duplica la confirmación.'
      tags:
      - Notificaciones
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: X-Webhook-Secret
        in: header
        required: true
        description: Secreto compartido (`Payments:Webhooks:Santander:Secret`).
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        description: HMAC-SHA256 del cuerpo crudo, en hexadecimal minúsculo. La clave se lee de `Payments:Webhooks:Santander:SigningKey`.
          El portal compara en tiempo constante.
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotification'
            examples:
              confirmado:
                value:
                  transactionId: 000981234567
                  externalReference: PAY-2026-000123
                  status: CONFIRMED
                  amount: 245000
                  currency: CLP
                  paidAt: '2026-10-20T14:31:55Z'
      responses:
        '200':
          description: Notificación aceptada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Secreto o firma inválidos. El pago no cambia.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                firmaInvalida:
                  value:
                    type: about:blank
                    title: No autorizado
                    status: 401
                    detail: La firma X-Signature no corresponde al cuerpo recibido.
                    instance: /ejemplo
                    correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación (NF-27). El portal lo envía en cada llamada; si falta, el servicio genera
        uno y lo devuelve en la respuesta.
      schema:
        type: string
        maxLength: 64
      example: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  headers:
    CorrelationId:
      description: Mismo valor recibido en la solicitud, o uno generado por el servicio.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de reintentar (RFC 9110 §10.2.3).
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 'Solicitud inválida: parámetro faltante o con formato incorrecto.'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            parametroInvalido:
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: Uno o más parámetros no cumplen el formato esperado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
                errors:
                - field: taxId
                  message: Debe tener el formato 12345678-9.
    NotFound:
      description: El recurso solicitado no existe.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noEncontrado:
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: No existe un recurso con el identificador indicado.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    TooManyRequests:
      description: Se superó el límite de solicitudes. El cliente reintenta después de `Retry-After`.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limite:
              value:
                type: about:blank
                title: Demasiadas solicitudes
                status: 429
                detail: Se superó el límite de solicitudes por minuto.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    InternalServerError:
      description: Error interno del servicio.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            errorInterno:
              value:
                type: about:blank
                title: Error interno
                status: 500
                detail: El servicio no pudo procesar la solicitud.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
    ServiceUnavailable:
      description: Servicio no disponible temporalmente (mantención o dependencia caída).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noDisponible:
              value:
                type: about:blank
                title: Servicio no disponible
                status: 503
                detail: El servicio está en mantención. Reintente más tarde.
                instance: /ejemplo
                correlationId: 3f2b8c1e-5d4a-4c7e-9a10-2b6f0e8d7c55
  schemas:
    Problem:
      type: object
      description: Detalle de error según RFC 9457 (`application/problem+json`). Admite miembros de extensión.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI que identifica el tipo de problema.
        title:
          type: string
          description: Resumen legible del tipo de problema.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Código HTTP.
        detail:
          type: string
          description: Explicación específica de esta ocurrencia.
        instance:
          type: string
          format: uri-reference
          description: URI de la ocurrencia concreta.
        correlationId:
          type: string
          description: 'Extensión: valor de `X-Correlation-Id`.'
        errors:
          type: array
          description: 'Extensión: errores de validación por campo.'
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - title
      - status
      additionalProperties: true
    PaymentInitiationRequest:
      type: object
      properties:
        externalReference:
          type: string
          maxLength: 50
          description: Número de pago del portal (`Payment.PaymentNumber`).
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          enum:
          - CLP
          - USD
        subject:
          type: string
          maxLength: 140
        payerTaxId:
          type: string
          pattern: ^[0-9]{7,8}-[0-9Kk]$
          description: RUT chileno con guion y dígito verificador.
        returnUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        notifyUrl:
          type: string
          format: uri
          description: URL del webhook del portal.
        expiresAt:
          type: string
          format: date-time
      required:
      - externalReference
      - amount
      - currency
      - subject
      - returnUrl
      - notifyUrl
    PaymentInitiation:
      type: object
      properties:
        reference:
          type: string
          description: Referencia del pago en el banco.
        externalReference:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - AUTHORIZED
          - CONFIRMED
          - REJECTED
          - EXPIRED
          - CANCELLED
          description: Estado del pago en el banco. `CONFIRMED` es el único estado que confirma el cobro en el portal.
        redirectUrl:
          type: string
          format: uri
          description: URL a la que se redirige al pagador.
        expiresAt:
          type: string
          format: date-time
      required:
      - reference
      - externalReference
      - status
      - redirectUrl
    PaymentStatus:
      type: object
      properties:
        reference:
          type: string
        externalReference:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - AUTHORIZED
          - CONFIRMED
          - REJECTED
          - EXPIRED
          - CANCELLED
          description: Estado del pago en el banco. `CONFIRMED` es el único estado que confirma el cobro en el portal.
        amount:
          type: number
        currency:
          type: string
          enum:
          - CLP
          - USD
        transactionId:
          type:
          - string
          - 'null'
          description: Número de transacción bancaria (NF-04).
        payerTaxId:
          type:
          - string
          - 'null'
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - reference
      - externalReference
      - status
      - amount
      - currency
    PaymentNotification:
      type: object
      description: Cuerpo de la notificación que el banco envía al portal.
      properties:
        transactionId:
          type: string
        externalReference:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - AUTHORIZED
          - CONFIRMED
          - REJECTED
          - EXPIRED
          - CANCELLED
          description: Estado del pago en el banco. `CONFIRMED` es el único estado que confirma el cobro en el portal.
        amount:
          type: number
        currency:
          type: string
          enum:
          - CLP
          - USD
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - transactionId
      - externalReference
      - status
      - amount
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clave de API. En el portal se guarda cifrada como secreto `SANTANDER_API_KEY` (NF-09).
